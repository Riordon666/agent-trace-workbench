name: Bug report
description: Report a reproducible problem without uploading private Agent data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Never attach real Agent histories, captures, API keys, certificates, prompts, tool output, or exported Sessions. Reduce the issue to a synthetic fixture.
  - type: dropdown
    id: surface
    attributes:
      label: Affected area
      options:
        - Installation / CLI / Doctor
        - Live Capture / Legacy MITM
        - Session Explorer / Import
        - Session Comparison / Analytics
        - Portable Trace / Annotation Export / Privacy
        - Terminal
        - Replay & Diagnostics
        - Claude Code adapter
        - Codex CLI adapter
        - Gemini CLI adapter
        - OpenCode adapter
        - Other
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: node_version
    attributes:
      label: Node.js version
      placeholder: v22.15.0
    validations:
      required: true
  - type: input
    id: atw_version
    attributes:
      label: ATW version or commit
      placeholder: 0.2.0 or git commit SHA
    validations:
      required: true
  - type: input
    id: agent_version
    attributes:
      label: Agent/API client and version
      description: Use “not applicable” for a package/UI-only problem.
      placeholder: Claude Code x.y.z / Codex CLI x.y.z / not applicable
    validations:
      required: true
  - type: dropdown
    id: capture_mode
    attributes:
      label: Data path
      options:
        - Local Agent History
        - Live Legacy MITM capture
        - Portable .atwtrace open or diff
        - Annotation directory export
        - No Session data / not applicable
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction with synthetic data
      description: Provide the smallest safe steps or synthetic fixture that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Exact error and sanitized Doctor output
      description: Include the exact error and relevant `atw doctor` lines. Remove usernames, private paths, hostnames, credentials, and Session content.
    validations:
      required: true
  - type: textarea
    id: trace
    attributes:
      label: Sanitized diagnostic evidence
      description: Prefer synthetic fixtures. If necessary, include only manually reviewed status/error metadata, never a raw real trace.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed real prompts, responses, tool data, credentials, local usernames, and private paths.
          required: true
